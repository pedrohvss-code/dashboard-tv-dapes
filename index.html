<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard TV</title>
  <script>
    // Sufixo único a cada carga: impede que a TV/navegador use CSS/JS antigos do cache
    window.V = Date.now();
    document.write('<link rel="stylesheet" href="style.css?v=' + V + '">');

    // Modo diagnóstico: abrir a URL com ?debug=1 mostra dados do navegador e erros na tela
    if (/[?&]debug=1/.test(location.search)) {
      var erros = [];
      window.onerror = function (msg, src, linha) { erros.push(msg + " (" + (src || "").split("/").pop() + ":" + linha + ")"); };
      window.addEventListener("unhandledrejection", function (e) { erros.push("Promise: " + e.reason); });
      setInterval(function () {
        var p = document.getElementById("debug");
        if (!p) {
          p = document.createElement("pre"); p.id = "debug";
          p.style.cssText = "position:fixed;left:20vw;top:25vh;z-index:99;max-width:60vw;margin:0;padding:12px;" +
            "background:rgba(0,0,0,.88);color:#0f0;font:16px/1.4 monospace;white-space:pre-wrap";
          document.body.appendChild(p);
        }
        p.textContent = "Janela: " + innerWidth + "x" + innerHeight + "  DPR: " + devicePixelRatio +
          "\nTela: " + screen.width + "x" + screen.height +
          "\nNavegador: " + navigator.userAgent +
          "\nErros (" + erros.length + "):\n" + (erros.slice(-8).join("\n") || "nenhum");
      }, 1000);
    }
  </script>
</head>
<body>
  <header>
    <div class="marca">
      <img src="assets/logo-dm.png" alt="D&M Capital">
      <div class="titulo" id="titulo"></div>
    </div>
    <div class="relogio">
      <div class="hora" id="hora">--:--:--</div>
      <div class="data" id="data"></div>
    </div>
    <div class="pregao">
      <div class="status" id="status">B3</div>
      <div class="contagem" id="contagem"></div>
    </div>
  </header>

  <main id="telas">
    <div class="nome-tela" id="nome-tela"></div>
    <div class="indicador"><div class="barra" id="barra"></div></div>
  </main>

  <section class="noticias">
    <div class="noticias-rotulo">Notícias</div>
    <div class="noticias-janela"><div class="noticias-trilho" id="noticias">Carregando notícias…</div></div>
  </section>

  <footer id="rodape"></footer>

  <script>
    document.write('<script src="config.js?v=' + V + '"><\/script>');
    document.write('<script src="app.js?v=' + V + '"><\/script>');
  </script>
</body>
</html>
