<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard TV</title>
  <script>
    // Sufixo único a cada carga: impede que a TV/navegador use CSS/JS antigos do cache
    window.V = Date.now();
    document.write('<link rel="stylesheet" href="style.css?v=' + V + '">');
  </script>
</head>
<body>
  <header>
    <div class="marca">
      <img src="assets/logo-dm.png" alt="D&M Capital">
      <div class="titulo" id="titulo"></div>
    </div>
    <div class="relogio">
      <div class="hora" id="hora">--:--:--</div>
      <div class="data" id="data"></div>
    </div>
    <div class="pregao">
      <div class="status" id="status">B3</div>
      <div class="contagem" id="contagem"></div>
    </div>
  </header>

  <main id="telas">
    <div class="nome-tela" id="nome-tela"></div>
    <div class="indicador"><div class="barra" id="barra"></div></div>
  </main>

  <section class="noticias">
    <div class="noticias-rotulo">Notícias</div>
    <div class="noticias-janela"><div class="noticias-trilho" id="noticias">Carregando notícias…</div></div>
  </section>

  <footer id="rodape"></footer>

  <script>
    document.write('<script src="config.js?v=' + V + '"><\/script>');
    document.write('<script src="app.js?v=' + V + '"><\/script>');
  </script>
</body>
</html>
