<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard TV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="titulo">Painel<strong id="titulo"></strong></div>
    <div class="relogio">
      <div class="hora" id="hora">--:--:--</div>
      <div class="data" id="data"></div>
    </div>
    <div class="pregao">
      <div class="status" id="status">B3</div>
      <div class="contagem" id="contagem"></div>
    </div>
  </header>

  <main id="telas">
    <div class="nome-tela" id="nome-tela"></div>
    <div class="indicador"><div class="barra" id="barra"></div></div>
  </main>

  <footer id="rodape"></footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
